# Build the self-compiled FalloutNV exe on the owner's own Windows PC and publish it as a private release.
#
# Why a self-hosted runner: the build needs the owner's installed copy of the game (still the source for part of the
# data and the resources) and the MSVC 2008 RTM toolchain. Neither can go in this repo, so GitHub's own machines
# can't build it. The runner is registered with the labels [self-hosted, windows, fnv-build].
#
# Required runner environment (set in the runner's .env file, never committed):
#   FNV_GAME_DIR          the Fallout New Vegas install folder (read only; it is never modified)
#   FNV_MSVC9_RTM_ROOT    the unpacked VC 2008 RTM toolchain
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fnv-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, windows, fnv-build]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: cmd
        env:
          FNV_PROJ_ROOT: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: 1
        run: call runtime-next\build-all.cmd --out "%GITHUB_WORKSPACE%\dist"

      - name: Package
        shell: powershell
        run: |
          $v = "build-${{ github.run_number }}"
          Copy-Item README-PLAY.md dist\README.txt
          Compress-Archive -Path dist\* -DestinationPath "FNV-selfbuilt-$v.zip" -Force
          Add-Content -Path $env:GITHUB_ENV -Value "TAG=$v" -Encoding ascii

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Get-Content dist\build-summary.txt -Raw -ErrorAction SilentlyContinue
          if (-not $notes) { $notes = "Self-compiled build from ${{ github.sha }}." }
          gh release create $env:TAG "FNV-selfbuilt-$env:TAG.zip" --title "Self-built $env:TAG" --notes "$notes" --target ${{ github.sha }}
